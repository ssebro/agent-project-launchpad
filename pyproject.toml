[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project-launchpad"
version = "1.0.1"
description = "A project launcher and shared context for Codex, Claude Code, and GitHub Copilot CLI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Stephen Sebro"}]
keywords = ["codex", "claude-code", "terminal", "sessions", "handoff"]
classifiers = [
  "Environment :: Console :: Curses",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
agent-launchpad = "agent_launchpad.cli:main"
agent-projects = "agent_launchpad.cli:main"

[project.urls]
Homepage = "https://github.com/ssebro/agent-project-launchpad"
Issues = "https://github.com/ssebro/agent-project-launchpad/issues"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent_launchpad", "helpers"]
